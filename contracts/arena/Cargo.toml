[package]
name = "arena"
description = "Hairto Arena core contract: duels, price ticks, damage, seasons and scores"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-sandbox = "0.4.0"
near-api = "0.8.7"
cargo-near-build = "0.11.5"
tokio = { version = "1.54", features = ["full"] }
serde_json = "1"
ed25519-dalek = "2"
anyhow = "1"
