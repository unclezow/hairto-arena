[workspace]
resolver = "2"
members = ["arena", "mock-arena", "mock-ft-receiver", "mock-mt-receiver", "mock-usdc", "mock-vault", "vault"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
