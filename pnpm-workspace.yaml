packages:
  - apps/*
  - packages/*
allowBuilds:
  bufferutil: false
  utf-8-validate: false
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.10'
  - '@turbo/darwin-arm64@2.11.10'
  - '@turbo/linux-64@2.11.10'
  - '@turbo/linux-arm64@2.11.10'
  - '@turbo/windows-64@2.11.10'
  - '@turbo/windows-arm64@2.11.10'
  - turbo@2.11.10
