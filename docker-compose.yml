name: hairto-arena-near

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hairto
      POSTGRES_PASSWORD: hairto
      POSTGRES_DB: hairto
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hairto -d hairto']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # The NEAR indexer: final blocks from Neardata into schema `chain`. Opt-in (`--profile indexer`); build it on the
  # host first with `pnpm --filter @hairto-arena/shared build && pnpm --filter @hairto-arena/indexer build`.
  # Settings come from apps/indexer/.env (see apps/indexer/.env.example); only the service addresses are set here.
  indexer:
    profiles: ['indexer']
    image: node:24-alpine
    working_dir: /repo/apps/indexer
    command: ['node', 'dist/main.js']
    volumes:
      - .:/repo:ro
    env_file:
      - path: apps/indexer/.env
        required: false
    environment:
      DATABASE_URL: postgresql://hairto:hairto@postgres:5432/hairto
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # It resumes from its cursor after any crash or restart; a short outage is caught up by gap-fill.
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
