<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hairto Arena on NEAR">
  <rect width="512" height="512" rx="112" fill="#0b0d10"/>
  <!-- arena ring: long (green) left, short (red) right -->
  <path d="M236 52 A204 204 0 0 0 236 460" fill="none" stroke="#22c55e" stroke-width="20" stroke-linecap="round"/>
  <path d="M276 52 A204 204 0 0 1 276 460" fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>
  <!-- H: left pillar (long, points up) -->
  <polygon points="146,372 146,196 206,136 206,372" fill="#22c55e"/>
  <!-- H: right pillar (short, points down) -->
  <polygon points="306,140 366,140 366,316 306,376" fill="#ef4444"/>
  <!-- crossbar: live price line -->
  <polyline points="206,318 238,262 270,296 306,214" fill="none" stroke="#ededed" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="306" cy="214" r="14" fill="#ededed"/>
</svg>
